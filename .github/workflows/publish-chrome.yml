name: Publish to Chrome Web Store

# Uploads the Chrome zip of a GitHub release to the store and submits it for review.
# Called by release.yml after each `vX.Y.Z` release; run it by hand (Actions → Publish to Chrome Web Store)
# to resubmit a release. Setup and approval: docs/chrome-web-store-api.md.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.1
        type: string
        required: true

permissions: {}

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    name: Upload and submit for review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers on this environment approve each submission before the job starts.
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/cikmlhdhgneblnmkkmiolciffcgbgljj
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tag must be a release version
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download the release zip
        run: gh release download "$TAG" --pattern "layout-fixer-chrome-${TAG#v}.zip" --dir package
      # Workload Identity Federation: GitHub's OIDC token is exchanged for a short-lived Google token,
      # so no key or refresh token is stored in the repository.
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: cikmlhdhgneblnmkkmiolciffcgbgljj
        run: node apps/extension/build/publish-chrome-web-store.ts "package/layout-fixer-chrome-${TAG#v}.zip" "${TAG#v}"

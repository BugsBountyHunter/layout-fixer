[package]
name = "layout-fixer-desktop"
version = "0.1.0"
description = "Fix text typed with the wrong keyboard layout, in any app"
authors = ["Layout Fixer contributors"]
license = "MIT"
repository = "https://github.com/BugsBountyHunter/layout-fixer"
edition = "2021"
rust-version = "1.85"

[lib]
name = "layout_fixer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

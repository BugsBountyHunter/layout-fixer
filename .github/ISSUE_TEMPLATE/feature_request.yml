name: Feature or layout request
description: Suggest an improvement or a new language/keyboard layout
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem first, then the solution you have in mind.
    validations:
      required: true
  - type: input
    id: layout
    attributes:
      label: Language and keyboard layout (for layout requests)
      placeholder: Persian — Windows "Persian" layout
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Sites, browsers, screenshots or examples.

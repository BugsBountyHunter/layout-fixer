name: Bug report
description: Something doesn't convert or behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please don't paste private messages — a short made-up example is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
      placeholder: |
        Selected "hgsghl" in a Gmail reply and pressed Alt+Shift+F.
        Expected "السلام", got nothing.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Website or field
      placeholder: Gmail compose, WhatsApp Web, a plain <textarea>, playground card 3…
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Brave, Opera, Vivaldi, Firefox, Firefox for Android, Other]
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "140.0.7339.80"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, ChromeOS, Android]
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Arabic keyboard layout
      options: [Automatic, PC, Mac, Not sure]
  - type: input
    id: version
    attributes:
      label: Layout Fixer version
      description: Shown at the top of the settings page.
      placeholder: "1.0.0"
